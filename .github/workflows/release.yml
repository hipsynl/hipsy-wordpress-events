name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Build plugin zip
        run: |
          chmod +x scripts/build_zip.sh scripts/generate_wp_readme.sh scripts/extract_changelog.sh
          yarn install --frozen-lockfile
          yarn build

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/extract_changelog.sh "$VERSION" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hipsy-events.zip
          body_path: release-notes.md
